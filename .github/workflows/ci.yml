name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Same toolchain as mise.toml, so a new stable lint cannot fail CI without a code change.
  RUST_TOOLCHAIN: "1.98.1"

defaults:
  run:
    shell: bash

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-14
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.os }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --all --check

      - name: Test
        run: cargo test --locked --workspace --all-features

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  # Builds the release archives that the Release workflow publishes. It also runs on
  # pull requests, so a cross-compilation failure is found before a tag exists.
  build:
    name: Build (${{ matrix.target }})
    needs: checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            build-command: cargo build
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            build-command: cargo zigbuild
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}

      - name: Restore cargo cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Zig
        if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1

      - name: Install cargo-zigbuild
        if: matrix.target == 'x86_64-unknown-linux-musl'
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-zigbuild

      - name: Build binary
        run: ${{ matrix.build-command }} --locked --release --target ${{ matrix.target }}

      # The archive name uses the Cargo.toml version, which the Release workflow
      # verifies against the tag and against herdr-plugin.toml.
      - name: Package archive
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          archive="herdr-yank-v${version}-${TARGET}.tar.gz"
          mkdir -p dist stage
          cp "target/${TARGET}/release/herdr-yank" stage/
          tar -czf "dist/${archive}" -C stage herdr-yank
          cd dist
          shasum -a 256 "${archive}" > "${archive}.sha256"

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
