name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # install-binary.sh downloads the asset for the herdr-plugin.toml version from the
  # tag of the same name. A tag that does not agree with the manifests publishes
  # assets that no installation can find, thus the release stops here instead.
  verify-version:
    name: Verify tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compare the tag with the manifest versions
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          crate="$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          plugin="$(awk -F'"' '/^version = "/ { print $2; exit }' herdr-plugin.toml)"
          echo "tag=${tag} Cargo.toml=${crate} herdr-plugin.toml=${plugin}"
          if [ "${tag}" != "${crate}" ] || [ "${tag}" != "${plugin}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} must match Cargo.toml (${crate}) and herdr-plugin.toml (${plugin})."
            exit 1
          fi

  ci:
    name: CI
    needs: verify-version
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish release assets
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Verify checksums
        run: |
          set -euo pipefail
          cd dist
          ls -l
          shasum -a 256 -c ./*.sha256

      # Signed build provenance. Verify an archive with:
      #   gh attestation verify <archive> --repo pgilad/herdr-yank
      # GitHub gives attestations to private repositories only on Enterprise plans.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - name: Upload release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          fail_on_unmatched_files: true
