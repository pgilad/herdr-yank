[package]
name = "herdr-yank"
version = "1.0.0"
edition = "2021"
# The oldest toolchain that the locked dependencies accept.
rust-version = "1.85"
description = "Herdr plugin for tmux-fingers-style visible terminal yanking"
license = "MIT"

[dependencies]
anyhow = "1.0"
base64 = "0.23"
clap = { version = "4.6", features = ["derive", "env"] }
crossterm = "0.29"
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
toml = "1.1"
unicode-width = "0.2.2"
which = "8.0"

[dev-dependencies]
pretty_assertions = "1.4"
